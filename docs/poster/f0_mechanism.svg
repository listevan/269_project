<text x="24.0" y="28.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">A negative update on one token hands its probability to the tokens the model</text>
<text x="24.0" y="48.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">already favors</text>
<text x="24.0" y="69.6" font-size="12" fill="#52514e" text-anchor="start">Schematic, not data. The penalized token's mass is redistributed in proportion to the rest of the</text>
<text x="24.0" y="85.2" font-size="12" fill="#52514e" text-anchor="start">distribution, so the choice the model already favors gains most.</text>
