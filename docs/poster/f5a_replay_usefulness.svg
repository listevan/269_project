<text x="24.0" y="292.6" font-size="12" fill="#52514e" text-anchor="start">Random's effect sits entirely in near-certain tokens (p &gt; 0.99) inside</text>
<text x="24.0" y="308.8" font-size="12" fill="#52514e" text-anchor="start">correct answers: replacing one breaks the answer. OPSA has no such</text>
<text x="24.0" y="325.0" font-size="12" fill="#52514e" text-anchor="start">tokens, so the gap is about determinism, not selection.</text>
