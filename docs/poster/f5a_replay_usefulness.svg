<text x="24.0" y="28.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">Study 3. Are the tokens OPSA punishes worth keeping? Usefulness by replay on MATH-500</text>
<text x="24.0" y="49.6" font-size="12" fill="#52514e" text-anchor="start">Qwen3-1.7B, 64 positions per rule from 24 mixed problems; 8 continuations with the token kept and 8 with it replaced. U = P(correct | kept) minus</text>
<text x="24.0" y="65.2" font-size="12" fill="#52514e" text-anchor="start">P(correct | replaced); 95% intervals over problems. Right: OPSA's tokens by the model's probability of the token, positions in brackets.</text>
